spring.application.name=lynkr-backend

# Web Server Port Binding for Render
server.port=${PORT:8080}

# Pure In-Memory H2 Database (No external network, no passwords, instant boot)
spring.datasource.url=jdbc:h2:mem:lynkrdb;DB_CLOSE_ON_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Web Console
spring.h2.console.enabled=true

# Lynkr Custom Application Config
lynkr.app.base-url=https://lynkr-backend-3kal.onrender.com
lynkr.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
lynkr.jwt.expiration-ms=86400000
